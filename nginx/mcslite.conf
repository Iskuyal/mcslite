# ============================================================
#  MCSLite · Nginx 反向代理配置（前端静态 + 后端 API + WebSocket）
#  目标：Windows Server 2016 + 已部署的 Nginx，面板只监听 127.0.0.1:8787
#
#  用法：把本文件内容并入 nginx.conf 的 http{} 内，或
#        放到 conf.d/mcslite.conf 后 `nginx -t && nginx -s reload`
# ============================================================

# WebSocket 升级需要按请求头决定 Connection 值；直接写死 "upgrade" 会让
# 普通 HTTP 请求也带上 Connection: upgrade，长连接与 keepalive 立刻劣化。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 面板 API 是管理面，默认只允许内网/办公室网段，按需修改
# （若你已在上层做认证，可把这两行删掉）
# acl 在 nginx 里没有原生 allow 之外的写法，用 geo 做黑白名单最省事
geo $mcslite_allowed {
    default          0;
    127.0.0.1        1;
    10.0.0.0/8       1;
    172.16.0.0/12    1;
    192.168.0.0/16   1;
}

upstream mcslite_backend {
    server 127.0.0.1:8787;
    keepalive 16;          # 复用到后端的连接，省掉每请求一次 TCP 握手
}

server {
    listen       80;
    listen       [::]:80;
    server_name  mc.example.com;

    # ——— HTTP → HTTPS：管理面板绝不走明文 ———
    location /.well-known/acme-challenge/ { root C:/nginx/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  mc.example.com;

    ssl_certificate      C:/nginx/cert/mcslite.crt;      # 换你自己的证书（内网可用自签+导入根证书）
    ssl_certificate_key  C:/nginx/cert/mcslite.key;
    ssl_protocols        TLSv1.2 TLSv1.3;               # Server 2016 的 SChannel 默认支持 1.2；TLS1.3 需较新 OpenSSL 版 nginx
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:SSL:5m;
    ssl_session_timeout  1d;

    # ——— 静态前端（web/dist 由 Vite 构建产出）———
    root  G:/MCSLite/web/dist;
    index index.html;

    gzip            on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary       on;
    gzip_types      text/css application/javascript application/json image/svg+xml font/woff2;

    # 面板的 JS/CSS 文件名带内容哈希：immutable 缓存，改版后天然失效
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html 绝不缓存，否则前端更新后用户卡在旧版本
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # ——— 管理面白名单（仅放行内网；不需要就整段删掉）———
    location ^~ /api/ {
        if ($mcslite_allowed = 0) { return 403; }

        proxy_pass         http://mcslite_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # 面板只在请求来自回环时才采信 X-Forwarded-For，配错不会被伪造
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 上传地图/模组包：面板侧流式落盘，堆内存恒定，这里只放开体积闸口
        client_max_body_size 512m;
        client_body_buffer_size 256k;     # 超出即写临时文件，不吃 nginx 自身内存
        client_body_timeout     300s;
        proxy_read_timeout      300s;
        proxy_request_buffering off;      # 关键：边收边传给 Node，不先把 512MB 攒进内存/磁盘缓冲
    }

    # ——— WebSocket 实时日志/指标 ———
    location ^~ /ws {
        if ($mcslite_allowed = 0) { return 403; }

        proxy_pass         http://mcslite_backend/ws;   # 显式带路径：即使挂在子路径下也能对上后端的精确匹配
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 日志流是长连接：关掉读超时与缓冲，否则会出现「日志卡住不动」
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding on;
    }

    # 健康检查（给监控/uptime 用，免鉴权）
    location = /api/health {
        proxy_pass http://mcslite_backend/api/health;
        access_log off;
    }

    # 面板自己的日志绝不外泄
    location ^~ /data/    { return 404; }
    location ~ /\..*      { return 404; }
}
